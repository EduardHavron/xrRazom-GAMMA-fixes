name: Build & release xrRazom fixes

on:
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - 'pack/**'
      - 'installer/**'
      - 'agent/**'
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xrrfix-release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    # runs even when tests failed, so the Discord step can report the failure
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require green tests
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          echo "tests: $TESTS_RESULT"
          [ "$TESTS_RESULT" = "success" ] || { echo "::error::Tests failed - no release"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LuaJIT / xmllint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit libxml2-utils
          luajit -v

      - name: Validate (pack.json, Lua syntax, XML warnings)
        run: python3 .github/scripts/build_pack.py validate --repo .

      - name: Build zip
        id: build
        run: |
          VERSION="$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/build_pack.py build --repo . --version "$VERSION" --out dist
          echo '--- pack.txt ---'; cat dist/pack.txt
          echo '--- notes.md ---'; cat dist/notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/xrRazom_fixes.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "xrRazom fixes $VERSION" \
            --notes-file dist/notes.md \
            --latest

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
          VERSION: ${{ steps.build.outputs.version }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "DISCORD_WEBHOOK secret not set, skipping"; exit 0; fi
          [ -n "$COMMIT_MSG" ] || COMMIT_MSG="Ручная сборка"
          if [ "$JOB_STATUS" = "success" ]; then
            MODS=$(python3 -c "import json;print('\n'.join('• '+m for m in json.load(open('pack/pack.json',encoding='utf-8-sig'))['mods']))")
            PAYLOAD=$(jq -n --arg t "Фиксы xrRazom $VERSION" --arg u "$REPO_URL/releases/tag/v$VERSION" \
              --arg d "$(printf '%s\n\n**Состав:**\n%s\n\nАгент у пира поставит обновление в течение 10 минут (при закрытом MO2).' "${COMMIT_MSG%%$'\n'*}" "$MODS")" \
              --arg a "$ACTOR" \
              '{username:"xrRazom fixes", embeds:[{title:$t, url:$u, description:$d, color:5763719, footer:{text:("опубликовал "+$a)}}]}')
          else
            PAYLOAD=$(jq -n --arg u "$RUN_URL" --arg d "$(printf 'Коммит: %s\nРелиз не создан, пир остаётся на прошлой версии.' "${COMMIT_MSG%%$'\n'*}")" \
              '{username:"xrRazom fixes", embeds:[{title:"Сборка фиксов упала", url:$u, description:$d, color:15548997}]}')
          fi
          curl -fsS -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK" && echo "Discord notified" || echo "::warning::Discord notification failed"
