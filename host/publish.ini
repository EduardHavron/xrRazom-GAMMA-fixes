; Настройки публикатора фиксов (host\publish.bat).
; gamma_root - папка GAMMA (где ModOrganizer.exe). Пусто = папка над репозиторием
;              (например D:\Games\Gamma). Относительный путь - от папки host\.
; profile    - профиль MO2. Пусто = активный профиль из ModOrganizer.ini
; section    - имя разделителя MO2, моды которого публикуются. Пусто = xrRazom Sync
; push       - 1 = отправлять на GitHub (git push), 0 = только локальный коммит
gamma_root=
profile=
section=xrRazom Sync
push=1
